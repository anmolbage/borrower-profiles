<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2e1065">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profiles">
<meta name="robots" content="noindex">
<title>Borrower Profiles</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ======================= LOGIN ======================= -->
<div id="login" class="hidden">
  <div class="logo">BP</div>
  <h1>Borrower Profiles</h1>
  <p class="tag">Sign in with your Loan CRM username and PIN</p>
  <div class="field">
    <label>Username</label>
    <input id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="your username">
  </div>
  <div class="field">
    <label>PIN</label>
    <div class="pindots" id="pinDots"></div>
  </div>
  <div class="pinpad" id="pinPad"></div>
  <button class="btn" id="loginBtn">Sign in</button>
  <p class="tag" id="loginMsg" style="margin:14px 0 0;min-height:20px;color:var(--danger);font-weight:600"></p>
</div>

<!-- ======================= APP ======================= -->
<div id="app" class="hidden">
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-customers"></section>
  <section class="screen" id="s-segments"></section>
  <section class="screen" id="s-more"></section>

  <nav class="nav" id="nav">
    <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-go="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Customers</button>
    <button data-act="update" aria-label="Update"><span class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span></button>
    <button data-go="segments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>Segments</button>
    <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/><circle cx="5" cy="12" r="1.4"/></svg>More</button>
  </nav>
</div>

<!-- full-screen profile -->
<div class="fullsheet" id="detail"></div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
